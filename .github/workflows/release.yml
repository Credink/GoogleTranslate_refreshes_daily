name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.4). Leave empty to only build artifacts."
        required: false
        default: ""

permissions:
  contents: write

env:
  VERSION: "0.1.4"
  GO_VERSION: "1.26.x"
  NODE_VERSION: "22"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Wails
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
      - name: Package Windows
        shell: pwsh
        run: |
          $env:Path = "$(go env GOPATH)\bin;" + $env:Path
          $env:VERSION = "${{ env.VERSION }}"
          powershell -ExecutionPolicy Bypass -File .\scripts\package-windows.ps1
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: |
            packages/*-windows-amd64-*-portable.zip
            packages/*installer*.exe
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Linux GUI deps
        run: |
          sudo apt-get update
          # Wails v2.17 pkg-config requires webkit2gtk-4.0 (not only 4.1).
          # AppImage bundling (linuxdeploy + GTK plugin) also needs dpkg-dev / python3.
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libayatana-appindicator3-dev \
            pkg-config \
            build-essential \
            curl \
            file \
            desktop-file-utils \
            dpkg-dev \
            python3 \
            python3-pil \
            imagemagick \
            libfuse2
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
      - name: Package Linux AppImage
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          export VERSION="${{ env.VERSION }}"
          export APPIMAGE_EXTRACT_AND_RUN=1
          bash scripts/package-linux.sh
          # Sanity: bundled AppImage should embed webkit (size >> bare Go binary).
          APP="$(ls -1 packages/*-linux-amd64-*.AppImage | tail -n1)"
          SIZE="$(wc -c <"$APP" | tr -d ' ')"
          echo "AppImage=$APP bytes=$SIZE"
          test "$SIZE" -gt 20000000
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: |
            packages/*-linux-amd64-*.AppImage
            packages/.last-linux-appimage-libs.txt
          if-no-files-found: error

  build-darwin:
    # Apple Silicon preferred; continue-on-error so Win/Linux release still publishes
    # if this host/org cannot schedule macOS runners.
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
      - name: Package macOS DMG
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          export VERSION="${{ env.VERSION }}"
          bash scripts/package-darwin.sh
      - name: Upload Darwin artifact
        uses: actions/upload-artifact@v4
        with:
          name: darwin-app
          path: packages/*-darwin-*.dmg
          if-no-files-found: warn

  publish:
    needs: [build-windows, build-linux, build-darwin]
    runs-on: ubuntu-22.04
    if: |
      always() &&
      !cancelled() &&
      (needs.build-windows.result == 'success' || needs.build-linux.result == 'success') &&
      (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    steps:
      - uses: actions/checkout@v4
      - name: Resolve tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Flatten assets
        run: |
          mkdir -p dist
          find release-assets -type f \( \
            -name '*.zip' -o -name '*.tar.gz' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*installer*.exe' \
          \) -print -exec cp -n {} dist/ \;
          ls -la dist
          test -n "$(ls -A dist 2>/dev/null)" || { echo "no release assets"; exit 1; }
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          NOTES="## 谷歌翻译 Hosts 更新器 ${TAG}

          ### 本版要点

          - **打包**：Windows 便携 zip；macOS **DMG**（darwin-arm64）；Linux **AppImage**（amd64，捆绑 WebKitGTK/GTK/托盘库）
          - **默认调度**：\`on_app_start\`（软件启动时刷新）；可选每天午夜 / 按小时间隔
          - **Linux 提权**：普通用户跑 UI，写 hosts 时经 \`pkexec\` 仅提权 \`--apply-hosts\`（勿 sudo 整包）
          - **ZeroOmega**：修正 Linux/macOS 扩展配置路径发现，便于自动写入 DIRECT 绕过
          - **安全加固**：提升权限下的 \`--apply-hosts\` 与 hosts 写入校验（路径/内容守卫）

          ### 资源格式

          | 平台 | 格式 |
          |------|------|
          | Windows amd64 | 便携 zip（\`*-portable.zip\`）；可选 NSIS installer |
          | **macOS Apple Silicon** | **\`.dmg\`** |
          | **Linux x86_64** | **\`.AppImage\`**（DMG 仅为 macOS；Linux 用 AppImage） |

          - macOS：未公证；首次打开可能需「仍要打开」
          - Linux AppImage：\`chmod +x\` 后**普通用户**运行；已捆绑 WebKit（仍需 glibc/显示服务/GPU/字体/\`pkexec\`）
          - 使用说明：\`docs/user-flow.md\` / README / \`packages/README.md\`"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "${TAG} — Google Translate Hosts Updater" \
              --notes "$NOTES"
          fi
